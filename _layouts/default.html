<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.full_title %}{{ page.full_title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="google-site-verification" content="fjGwYDZDsmcpA8d7OGALfTUn2dXXozdSG-4-GbxkxGU">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/terminal.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <main class="window">
    <div class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">{{ page.titlebar | default: "shaun@shaunlp: ~" }}</span>
    </div>
    <div class="screen">
      {% unless page.hide_nav %}
      <nav class="nav"><a href="{{ '/' | relative_url }}">~</a> · <a href="{{ '/blog/' | relative_url }}">blog</a> · <a href="{{ '/resume/' | relative_url }}">resume</a></nav>
      {% endunless %}
      {{ content }}
    </div>
  </main>
</body>
</html>
